<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5968">
<title>Our Compass</title>
<meta name="description" content="A free, private toolkit for autistic children and their families: feelings check-in, calm corner, first/then, timers, everyday scenarios, a diary with patterns, and an All about me passport. Your diary stays on your phone, and a child's own device can be linked, with everything scrambled before it leaves the phone.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://thespectrumtechengine.com/ste-owner.js" data-app="our-compass" defer></script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Compass">
<style>
  /* Calm colours, no flashing, big touch targets. The theme comes from the child's interests. */
  :root{--bg:#f3f3f0;--card:#fffefb;--ink:#22313a;--soft:#5b6a72;--line:#e0e0da;--brand:#2f5968;--brand2:#4b8496;--tint:#e4ebec;
    --good:#2f7d5b;--goodbg:#e4f3ea;--warn:#8a5f10;--warnbg:#fbf0d9;--star:#c7901c;--r:16px;--fs:17px}
  body.th-animals{--bg:#fbf4ec;--brand:#a4572a;--brand2:#cf8350;--tint:#f5e4d3;--line:#ecdccb}
  body.th-space{--bg:#eef0fa;--brand:#3b3f8f;--brand2:#6a5fc1;--tint:#e0e2f6;--line:#d9dcef}
  body.th-nature{--bg:#eff5ec;--brand:#2f6b4a;--brand2:#4c9a6a;--tint:#dcecd9;--line:#d6e4d2}
  body.th-pinkpurple{--bg:#fbf1fa;--brand:#86398b;--brand2:#c25fb4;--tint:#f3dff1;--line:#ecd6ea}
  body.th-ocean{--bg:#eef4f8;--brand:#1f4e6e;--brand2:#3f7fa6;--tint:#dbe8f1;--line:#d3e0ea}
  body.big{--fs:20px}
  body.age-little{--r:22px}
  body.grown{--r:10px}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
  body.easy{font-family:Lexend,Verdana,system-ui,sans-serif;letter-spacing:.03em;word-spacing:.12em;line-height:1.6}
  body.easy button,body.easy input,body.easy textarea,body.easy select{font-family:inherit;letter-spacing:inherit}
  header{background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:6}
  header img{width:36px;height:36px;border-radius:9px}
  header h1{font-size:19px;margin:0;font-weight:700;white-space:nowrap}
  header .kid{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:6px 12px 6px 8px;min-height:40px;font-size:16px;display:flex;align-items:center;gap:6px;max-width:55%}
  header .kid span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .kid b{font-size:22px;font-weight:400}
  main{max-width:660px;margin:0 auto;padding:14px 14px 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  h2{font-size:1.15em;margin:0 0 8px}
  h3{font-size:1em;margin:14px 0 6px}
  p{margin:6px 0}
  .muted{color:var(--soft);font-size:.9em}
  .hidden{display:none!important}
  button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:#fff;cursor:pointer;min-height:48px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  button.light,.btn.light{background:var(--tint);color:var(--brand)}
  button.ghost{background:none;color:var(--brand);padding:8px 6px;min-height:40px}
  button.small{padding:7px 12px;min-height:38px;font-size:.88em}
  button:disabled{opacity:.45}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row>*{flex:1 1 auto}
  .row>.no-grow{flex:0 0 auto}
  input[type=text],input[type=search],input[type=date],input[type=datetime-local],input[type=number],textarea,select{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  textarea{min-height:76px;resize:vertical}
  label.lab{display:block;font-weight:600;margin:12px 0 4px}
  label.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:#fff;cursor:pointer}
  label.chk input{width:22px;height:22px;accent-color:var(--brand);flex:0 0 auto}
  label.chk small{display:block;color:var(--soft);font-size:.8em}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .switch:last-child{border-bottom:0}
  .switch input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:15px;background:#c9cfd2;position:relative;flex:0 0 auto;cursor:pointer;transition:background .2s}
  .switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
  .switch input:checked{background:var(--brand)}
  .switch input:checked::after{left:25px}
  .switch small{display:block;color:var(--soft);font-size:.8em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
  .chip{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88em;min-height:40px}
  .chip.on{border-color:var(--brand);background:var(--tint);color:var(--brand);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  body.age-little .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .tile{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:var(--r);padding:14px 10px;min-height:112px;flex-direction:column;text-align:center;font-weight:600;font-size:.95em;line-height:1.25}
  .tile b{font-size:34px;font-weight:400;line-height:1}
  .tile small{font-weight:400;color:var(--soft);font-size:.78em}
  body.grown .tile{min-height:92px}
  body.grown .tile b{font-size:26px}
  .pick{background:#fff;color:var(--ink);border:2px solid var(--line);padding:10px 6px;flex-direction:column;font-size:.85em}
  .pick.on{border-color:var(--brand);background:var(--tint)}
  .pick b{font-size:28px;font-weight:400;line-height:1.1}
  .colours{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .colour{color:#fff;min-height:96px;flex-direction:column;font-weight:700;font-size:1.05em;border-radius:var(--r);text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .colour small{font-weight:400;font-size:.75em;opacity:.95}
  .colours.mini .colour{min-height:58px;font-size:.9em}
  .list{list-style:none;margin:0;padding:0}
  .list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .list li:last-child{border-bottom:0}
  .list .grow{flex:1;min-width:0}
  .list .name{font-weight:600}
  .note{background:var(--tint);border-radius:12px;padding:12px;font-size:.85em;color:var(--soft)}
  .ok{background:var(--goodbg);color:var(--good);border-radius:12px;padding:12px}
  .opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);margin:8px 0;justify-content:flex-start}
  .opt.open{border-color:var(--brand2)}
  .opt.open.good{border-color:var(--good)}
  .how{margin:-4px 0 10px;padding:10px 12px;border-radius:0 0 12px 12px;background:var(--tint);font-size:.92em}
  .how.good{background:var(--goodbg)}
  .bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--brand2)}
  .stack{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:6px 0}
  .stack i{display:block;height:100%}
  .stars{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .stars span{width:44px;height:44px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:26px}
  .stars span.on{border:2px solid var(--star);background:#fbf3df}
  .ft{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
  .ft .slot{background:#fff;border:3px solid var(--line);color:var(--ink);border-radius:var(--r);min-height:170px;flex-direction:column;font-weight:700;font-size:1.05em;padding:10px}
  .ft .slot b{font-size:60px;font-weight:400}
  .ft .slot.done{opacity:.45}
  .ft .slot.now{border-color:var(--brand)}
  .ft .arrow{align-self:center;font-size:30px;color:var(--soft)}
  .ft .lbl{font-size:.75em;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);font-weight:700}
  .pie{width:min(260px,70vw);aspect-ratio:1;border-radius:50%;margin:10px auto;display:grid;place-items:center;border:6px solid var(--brand)}
  .pie div{background:var(--card);border-radius:50%;width:56%;aspect-ratio:1;display:grid;place-items:center;font-weight:700;font-size:1.3em;text-align:center;line-height:1.1}
  .breathe{width:min(280px,72vw);aspect-ratio:1;margin:18px auto;display:grid;place-items:center;position:relative}
  .breathe .ball{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--brand2),var(--brand));transform:scale(.45);opacity:.85}
  .breathe .txt{position:relative;color:#fff;font-weight:700;font-size:1.25em;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.3)}
  .breathe.in .ball{transform:scale(1);transition:transform var(--pace) ease-in-out}
  .breathe.out .ball{transform:scale(.45);transition:transform var(--pace) ease-in-out}
  body.calmer .breathe .ball,body.calmer .breathe.in .ball,body.calmer .breathe.out .ball{transform:scale(.8)!important;transition:opacity var(--pace) ease-in-out}
  body.calmer .breathe.in .ball{opacity:1}
  body.calmer .breathe.out .ball{opacity:.45}
  .battery{display:grid;gap:8px}
  .battery button{justify-content:flex-start;background:#fff;color:var(--ink);border:2px solid var(--line);gap:14px}
  .battery button.on{border-color:var(--brand);background:var(--tint)}
  .cells{display:inline-flex;gap:3px;padding:3px;border:2px solid var(--soft);border-radius:5px;position:relative}
  .cells::after{content:"";position:absolute;right:-6px;top:30%;width:4px;height:40%;background:var(--soft);border-radius:0 2px 2px 0}
  .cells i{width:12px;height:22px;border-radius:2px;background:#e3e6e7}
  .cells i.f{background:var(--good)}
  .cells.lo i.f{background:#d6a21e}
  .cells.em i.f{background:#c9503f}
  .overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff}
  .overlay .big{font-size:clamp(34px,9vw,64px);font-weight:800;line-height:1.15}
  .overlay .emo{font-size:clamp(70px,22vw,140px)}
  .sheet{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
  .sheet>div{background:var(--card);width:100%;max-width:660px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#22313a;color:#fff;border-radius:12px;padding:10px 14px;z-index:30;display:flex;gap:12px;align-items:center;max-width:92vw}
  .toast button{background:none;color:#ffd77a;min-height:36px;padding:4px 8px}
  .crisis{position:fixed;inset:0;z-index:25;background:#24323a;color:#f2efe8;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
  .crisis .step{flex:1;display:grid;place-items:center;font-size:clamp(24px,6.5vw,38px);line-height:1.35;text-align:center;font-weight:600}
  .crisis button.light{background:#3a4a53;color:#f2efe8}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px 2px;scrollbar-width:none}
  .tabs button{flex:0 0 auto;background:var(--card);color:var(--soft);border:1px solid var(--line);min-height:42px;padding:8px 12px;font-size:.88em}
  .tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .deco{font-size:22px;letter-spacing:6px;text-align:center;opacity:.75;margin:-4px 0 8px}
  body.grown .deco{display:none}
  .hello{font-size:1.3em;font-weight:700;margin:2px 0 10px}
  .say{background:var(--tint);color:var(--brand);min-height:40px;padding:6px 10px;font-size:.88em}
  .entry .what{white-space:pre-wrap}
  .tag{display:inline-block;font-size:.75em;background:var(--tint);color:var(--brand);border-radius:999px;padding:2px 8px;margin:2px 4px 0 0}
  .story-step{font-size:1.25em;line-height:1.5;min-height:140px;display:grid;place-items:center;text-align:center;padding:10px}
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:8}
  nav button{flex:1;background:none;color:var(--soft);border-radius:0;padding:8px 2px;font-size:12px;min-height:62px;flex-direction:column;gap:0}
  nav button b{display:block;font-size:22px;font-weight:400}
  nav button.on{color:var(--brand);font-weight:700}
  .av{border-radius:50%;object-fit:cover;vertical-align:middle;background:#fff;flex:0 0 auto}
  #pad{width:100%;aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;display:block}
  .pens{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .pen{width:40px;height:40px;min-height:40px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .pen.on{box-shadow:0 0 0 3px var(--ink)}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
  .gallery button{padding:0;background:#fff;border:1px solid var(--line);overflow:hidden;min-height:0;display:block;position:relative}
  .gallery img{width:100%;display:block;aspect-ratio:1;object-fit:cover}
  .gallery i{position:absolute;left:6px;top:6px;width:14px;height:14px;border-radius:50%;border:2px solid #fff}
  .ste-logo-wrapper{display:flex;justify-content:center;margin:18px auto 10px}
  .ste-logo-img{width:min(220px,64%);height:auto;display:block}
  #print{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media print{
    body{background:#fff;padding:0;font-size:12.5px}
    body>*:not(#print){display:none!important}
    #print{display:block!important;color:#000}
    #print h2{font-size:18px} #print h3{font-size:14px;margin:12px 0 4px}
    #print .muted{color:#555}
    #print .card{border:0;padding:0;margin:0}
    #print .bar i,#print .stack i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  .code{font:700 2em/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-align:center;margin:10px 0;color:var(--brand)}
  input.code-in{font:700 1.5em ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;text-align:center;text-transform:uppercase}
  .scan{width:100%;max-width:360px;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#000;display:block;margin:8px auto}
  .link-note{margin-top:14px;text-align:center}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <h1>Our Compass</h1>
  <button class="kid hidden" id="kidBtn" data-a="kids" aria-label="Switch child"></button>
</header>
<main id="app"></main>
<nav id="nav">
</nav>
<div id="layer"></div>
<div id="print"></div>
<input type="file" id="photoIn" accept="image/*" class="hidden">
<script src="content.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
